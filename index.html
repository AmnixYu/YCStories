<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f2ed">
  <meta name="description" content="鱼肠 YuChang 的个人影像作品集。">
  <title>鱼肠 YuChang｜影像作品集</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=thumbnail-16x9-final">

  <style>
    #workGrid .work-card .work-image{width:100%!important;height:auto!important;aspect-ratio:16/9!important;overflow:hidden!important;position:relative!important}
    #workGrid .work-card .work-image img{position:absolute!important;inset:0!important;width:100%!important;height:100%!important;object-fit:cover!important;object-position:center center!important}
  </style>
</head>
<body id="top">
  <header class="site-header">
    <a class="brand" href="./" aria-label="鱼肠 YuChang 首页">
      <img class="brand-avatar" src="https://sns-avatar-qc.xhscdn.com/avatar/1040g2jo31vcua93a1u005o1d77i0biuf7bql7g8?imageView2/2/w/540/format/webp|imageMogr2/strip2" alt="">
      <span>鱼肠 <i>YuChang</i></span>
    </a>
    <nav aria-label="主导航"><a href="#works">作品</a><a href="#about">关于</a><a href="#contact">联系 <span>↗</span></a></nav>
  </header>

  <main>
    <section class="intro-band" aria-label="创作者简介">
      <p id="heroIntro">我想讲述有质感的好故事，AI 让我脑海里的故事得以视觉化地呈现。</p>
      <a class="intro-contact" href="#contact">合作与联系 <span>↗</span></a>
    </section>

    <section class="works-section" id="works">
      <div class="section-heading"><h1>作品</h1><span class="work-count" id="workCount"></span></div>
      <div class="filter-row" id="filters" aria-label="作品分类"></div>
      <div class="work-grid" id="workGrid"><div class="loading">作品载入中…</div></div>
    </section>

    <section class="about-section" id="about">
      <div class="section-heading about-heading"><h2 id="aboutTitle">关于我</h2></div>
      <div class="about-layout">
        <div class="about-main"><p id="aboutText">我想讲述有质感的好故事。AI 让我脑海里的故事得以视觉化地呈现。</p><p class="about-note" id="aboutNote"></p></div>
        <div class="about-side"><span class="field-label">创作方向</span><div class="skills" id="skills"></div></div>
      </div>
    </section>

    <section class="contact-section" id="contact">
      <div class="contact-heading"><h2 id="contactTitle">联系合作</h2><p id="contactText">欢迎有趣的创作想法与合作。</p></div>
      <div class="contact-details">
        <div class="contact-channel" id="contactChannel" hidden><span>EMAIL</span><strong id="contactEmail"></strong></div>
        <a class="contact-link" href="mailto:" id="contactFallback" hidden>与我联系 <span>↗</span></a>
      </div>
    </section>
  </main>

  <footer><span>© <span id="year"></span> <span id="footerName">鱼肠 YuChang</span></span><a href="#top" aria-label="回到顶部">回到顶部 ↑</a></footer>

  <div class="modal-backdrop" id="modal" aria-hidden="true">
    <section class="project-modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <button class="modal-close" id="modalClose" aria-label="关闭">×</button>
      <div class="modal-video" id="modalVideo"></div>
      <div class="modal-content">
        <p class="eyebrow" id="modalCategory">作品</p><h2 id="modalTitle"></h2><p class="modal-subtitle" id="modalSubtitle"></p>
        <div class="modal-description" id="modalDescription"></div><div class="modal-tags" id="modalTags"></div>
        <a class="text-link external-link" id="originalLink" href="#" target="_blank" rel="noopener noreferrer">打开原视频 <span>↗</span></a>
      </div>
    </section>
  </div>
  <script src="app.js?v=thumbnail-16x9-final"></script>
</body>
</html>
